<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div th:replace="~{layout :: nav}"></div>
<main>
  <h1>Admin: Manage Products</h1>
  <form class="box" th:action="@{/admin/products}" method="post" th:object="${form}">
    <input type="hidden" th:field="*{id}">
    <input th:field="*{name}" placeholder="Name" required>
    <input th:field="*{description}" placeholder="Description">
    <input th:field="*{price}" type="number" step="0.01" placeholder="Price" required>
    <input th:field="*{stock}" type="number" placeholder="Stock" required>
    <input th:field="*{imageUrl}" placeholder="Image URL">
    <button class="btn">Save product</button>
  </form>
  <div class="scroll">
    <table>
      <tr><th>ID</th><th>Name</th><th>Price</th><th>Stock</th><th></th></tr>
      <tr th:each="p : ${products}">
        <td th:text="${p.id}"></td><td th:text="${p.name}"></td>
        <td th:text="'$' + ${p.price}"></td><td th:text="${p.stock}"></td>
        <td>
          <a class="btn secondary" th:href="@{/admin/products/{id}/edit(id=${p.id})}">Edit</a>
          <form th:action="@{/admin/products/{id}/delete(id=${p.id})}" method="post" style="display:inline">
            <button class="btn danger">Delete</button>
          </form>
        </td>
      </tr>
    </table>
  </div>
</main>
</body>
</html>
