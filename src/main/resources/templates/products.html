<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TechShop</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div th:replace="~{layout :: nav}"></div>
<main>
  <h1>Products</h1>
  <p th:if="${products.isEmpty()}">No products found.</p>
  <div class="grid">
    <div class="card" th:each="p : ${products}">
      <img th:src="${p.imageUrl}" alt="">
      <h3 th:text="${p.name}"></h3>
      <p class="price" th:text="'$' + ${p.price}"></p>
      <p class="muted" th:text="${p.stock > 0} ? 'In stock: ' + ${p.stock} : 'Out of stock'"></p>
      <a class="btn secondary" th:href="@{/product/{id}(id=${p.id})}">Details</a>
      <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post" style="display:inline">
        <button class="btn" th:disabled="${p.stock == 0}">Add to cart</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
