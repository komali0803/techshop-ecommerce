<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body>
<div th:replace="~{layout :: nav}"></div>
<main class="detail">
  <img th:src="${product.imageUrl}" alt="">
  <div>
    <h1 th:text="${product.name}"></h1>
    <p th:text="${product.description}"></p>
    <p class="price" th:text="'$' + ${product.price}"></p>
    <p class="muted" th:text="'Stock: ' + ${product.stock}"></p>
    <form th:action="@{/cart/add/{id}(id=${product.id})}" method="post">
      <button class="btn" th:disabled="${product.stock == 0}">Add to cart</button>
    </form>
    <p><a th:href="@{/}">&larr; Back to products</a></p>
  </div>
</main>
</body>
</html>
